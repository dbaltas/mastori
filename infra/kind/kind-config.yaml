# Local kind cluster for Mastori development.
#
# Topology mirrors the cloud design: a control-plane plus a CPU pool
# (API, scheduler, Redis, Prometheus, Grafana, mock workers, traffic
# generator) and a GPU pool (vLLM workers and the inference adapter;
# labeled now, backed by fake NVIDIA devices later). GPU workers carry
# the mastori/gpu taint so only inference workloads tolerate them.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mastori
nodes:
  - role: control-plane
    labels:
      mastori/pool: infra
    extraPortMappings:
      - containerPort: 30080
        hostPort: 7080
        protocol: TCP
      - containerPort: 30081
        hostPort: 7081
        protocol: TCP
  - role: worker
    labels:
      mastori/pool: cpu
  # GPU-pool workers are tainted with mastori/gpu=true:NoSchedule after
  # cluster creation (make cluster-up); kind's v1alpha4 schema has no
  # taints field.
  - role: worker
    labels:
      mastori/pool: gpu
  - role: worker
    labels:
      mastori/pool: gpu
