# Local kind cluster for Mastori development.
#
# Topology mirrors the cloud design: a control-plane plus a CPU pool
# (API, scheduler, Redis, Prometheus, Grafana) and a GPU pool
# (vLLM workers; labeled now, backed by fake NVIDIA devices later).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mastori
nodes:
  - role: control-plane
    labels:
      mastori/pool: infra
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
  - role: worker
    labels:
      mastori/pool: cpu
  - role: worker
    labels:
      mastori/pool: gpu
  - role: worker
    labels:
      mastori/pool: gpu
