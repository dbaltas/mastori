# Local kind cluster for Mastori development.
#
# Topology mirrors the cloud design: a control-plane plus a CPU pool
# (API, scheduler, Redis, Prometheus, Grafana, mock workers, traffic
# generator) and a GPU pool (vLLM workers and the inference adapter;
# backed by the fakegpu DaemonSet, which advertises fake nvidia.com/gpu
# extended resources since kind nodes have no NVIDIA hardware). GPU
# workers carry the mastori/gpu taint so only inference workloads
# tolerate them.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mastori
nodes:
  - role: control-plane
    labels:
      mastori/pool: infra
    extraPortMappings:
      # listenAddress 127.0.0.1 (review K-M5): the API and Grafana must not be
      # reachable by anyone on the same Wi-Fi — a laptop-wide default bind of
      # 0.0.0.0 is not part of the local benchmark loop.
      - containerPort: 30080
        hostPort: 7080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30081
        hostPort: 7081
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      mastori/pool: cpu
  # GPU-pool workers are tainted with mastori/gpu=true:NoSchedule after
  # cluster creation (make cluster-up); kind's v1alpha4 schema has no
  # taints field.
  - role: worker
    labels:
      mastori/pool: gpu
  - role: worker
    labels:
      mastori/pool: gpu
