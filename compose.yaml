services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "7079:6379"

  api:
    build: .
    ports:
      - "7080:8080"
    environment:
      REDIS_ADDR: redis:6379
      MAX_INFLIGHT: "1000"
      LOG_LEVEL: info
    depends_on:
      - redis

  scheduler:
    build: .
    entrypoint: ["/scheduler"]
    environment:
      REDIS_ADDR: redis:6379
      SCHEDULER_POLICY: round-robin
      LOG_LEVEL: info
    depends_on:
      - redis

  mockworker:
    build: .
    entrypoint: ["/mockworker"]
    deploy:
      replicas: 2
    environment:
      REDIS_ADDR: redis:6379
      WORKER_MIN_TOKENS: "16"
      WORKER_MAX_TOKENS: "96"
      WORKER_TOKEN_DELAY_MS: "10"
      WORKER_FIRST_DELAY_MS: "30"
    depends_on:
      - redis
      - scheduler

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "7090:9090"
