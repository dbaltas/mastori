services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "7079:6379"
  api:
    build: .
    ports:
      - "7080:8080"
    environment:
      REDIS_ADDR: redis:6379
      MAX_INFLIGHT: "1000"
      LOG_LEVEL: info
    depends_on:
      - redis

  scheduler:
    build: .
    entrypoint: ["/scheduler"]
    environment:
      REDIS_ADDR: redis:6379
      SCHEDULER_POLICY: round-robin
      LOG_LEVEL: info
    depends_on:
      - redis

  mockworker:
    build: .
    entrypoint: ["/mockworker"]
    deploy:
      replicas: 2
    environment:
      REDIS_ADDR: redis:6379
      WORKER_MIN_TOKENS: "16"
      WORKER_MAX_TOKENS: "96"
      WORKER_TOKEN_DELAY_MS: "10"
      WORKER_FIRST_DELAY_MS: "30"
    depends_on:
      - redis
      - scheduler

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    profiles: ["inference"]

  inference-adapter:
    build: .
    entrypoint: ["/adapter"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_MODEL: ${INFERENCE_MODEL:-qwen2.5:0.5b}
      LOG_LEVEL: info
    ports:
      - "7082:8080"
    profiles: ["inference"]
    depends_on:
      - ollama
      - redis

  vllmworker:
    build: .
    entrypoint: ["/vllmworker"]
    environment:
      REDIS_ADDR: redis:6379
      INFERENCE_BASE_URL: http://inference-adapter:8080
      INFERENCE_MODEL: ${INFERENCE_MODEL:-qwen2.5:0.5b}
    profiles: ["inference"]
    depends_on:
      - redis
      - inference-adapter

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "7090:9090"

volumes:
  ollama:
