apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: mastori
data:
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  DEFAULT_MODEL: "qwen2.5:0.5b"
  INFERENCE_MODEL: "qwen2.5:0.5b"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-adapter
  namespace: mastori
  labels:
    app: inference-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-adapter
  template:
    metadata:
      labels:
        app: inference-adapter
    spec:
      containers:
        - name: adapter
          image: mastori/api:latest
          imagePullPolicy: IfNotPresent
          command: ["/adapter"]
          envFrom:
            - configMapRef:
                name: inference-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-adapter
  namespace: mastori
spec:
  selector:
    app: inference-adapter
  ports:
    - port: 8080
      targetPort: 8080
