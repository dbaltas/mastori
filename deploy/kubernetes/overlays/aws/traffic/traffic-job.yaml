# Applied by `make cluster-run-traffic` (kind, raw: the local image tag is
# loaded into the node) and `make aws-run-traffic` (EKS, via the sibling
# kustomization that rewrites the image to GHCR). Both first generate the
# datasets-manifest ConfigMap from the benchmark submodule
# (benchmark/workloads/datasets.yaml) and regenerate the traffic-config
# ConfigMap from their TRAFFIC_* overrides. Deliberately not part of the base
# kustomization: `cluster-deploy` should not start a traffic run as a side
# effect.
#
# Data flow: the datasets initContainer prepares the dataset cache into a
# shared emptyDir — restore from the S3 remote cache (IRSA on EKS) or, on a
# cache miss, fetch from the source service and seed the bucket; without
# DATASETS_S3_BUCKET it fetches directly (local kind). The validate
# initContainer checks the cache against the manifest, then /traffic replays
# it against the in-cluster API. Records are also streamed to stdout
# (TRAFFIC_RECORDS_STDOUT), because the distroless image has no shell or tar
# for `kubectl cp`.
apiVersion: batch/v1
kind: Job
metadata:
  name: traffic
  namespace: mastori
spec:
  backoffLimit: 0
  # Bounded run (review low): a stuck runner must end the Job loudly, not
  # hold a node hostage. 4h covers the longest ladder plus cache seeding.
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: traffic
    spec:
      restartPolicy: Never
      nodeSelector:
        mastori/pool: cpu
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532 # nonroot's gid: the distroless containers need group write on /data
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: traffic
      initContainers:
        - name: datasets
          image: mastori/api:latest
          imagePullPolicy: IfNotPresent
          command:
            - /datasets
            - prepare
            - --manifest
            - /etc/mastori/datasets.yaml
            - --cache
            - /data/cache
          volumeMounts:
            - name: manifest
              mountPath: /etc/mastori
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
        # Fail the Job before any traffic if the fetched cache does not match
        # the manifest's row count, required fields, and spot checks.
        - name: datasets-validate
          image: mastori/api:latest
          imagePullPolicy: IfNotPresent
          command:
            - /datasets
            - validate
            - --manifest
            - /etc/mastori/datasets.yaml
            - --cache
            - /data/cache
          volumeMounts:
            - name: manifest
              mountPath: /etc/mastori
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
      containers:
        - name: traffic
          image: mastori/api:latest
          imagePullPolicy: IfNotPresent
          command: ["/traffic"]
          envFrom:
            - configMapRef:
                name: traffic-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: manifest
              mountPath: /etc/mastori
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # 512Mi OOMKilled at 20K-30K with MAX_INFLIGHT=5000 (api-config):
              # the open-loop sender holds ~5k concurrent SSE streams + record
              # buffers. 1Gi covers the deep-queue regime (2026-11-22).
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: manifest
          configMap:
            name: datasets-manifest
