# Traffic Job for EKS. Reuses deploy/kubernetes/overlays/aws/traffic/traffic-job.yaml
# (kept out of the main kustomizations so `cluster-deploy` never starts a run
# as a side effect); this overlay rewrites the image to GHCR (CI-published on
# every main push, see overlays/aws/kustomization.yaml), forces a pull, wires
# the IRSA-annotated traffic ServiceAccount, and sets the S3 remote-cache env
# for the datasets initContainer (restore on hit, seed on miss). Applied by
# `make aws-run-traffic`; the datasets-manifest and traffic-config ConfigMaps
# are (re)created by that target before the Job is applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - traffic-job.yaml
  - service-account.yaml
images:
  - name: mastori/api
    newName: ghcr.io/dbaltas/mastori
    newTag: latest
patches:
  - path: pull-policy.yaml
  - path: s3.yaml
