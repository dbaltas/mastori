# IRSA-annotated copy of deploy/kubernetes/base/traffic-sa.yaml for the EKS
# traffic Job. The role grants S3 read/write on the dataset cache bucket
# (restore on hit, seed on miss; see infra/aws/s3.tf). The trust policy pins
# this exact service account (system:serviceaccount:mastori:traffic).
#
# Fill the role ARN from Terraform after (re)applying the module:
#   make aws-datasets-cache-role  (prints the arn) — or
#   terraform -chdir=infra/aws output datasets_cache_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traffic
  namespace: mastori
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/REPLACE_ME
