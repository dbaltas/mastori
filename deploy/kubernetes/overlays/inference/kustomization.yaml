apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  # kind GPU pool: fake NVIDIA devices (no hardware), plus the inference
  # workloads that request them. overlays/aws-inference reuses the same
  # inference component against the real GPU node group and device plugin.
  - ../../components/fakegpu
  - ../../components/inference
  # Keep the host port mappings (7080/7081) that the local overlay provides;
  # applying this overlay must not revert them. Shared component instead of
  # the previously duplicated patch files (review nit).
  - ../../components/nodeport
