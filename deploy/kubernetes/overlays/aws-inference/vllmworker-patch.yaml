# Cloud deltas for the vllmworker bridge:
#  - INFERENCE_BASE_URL -> the real vLLM Service (no Ollama adapter in the
#    cloud path; vLLM serves the OpenAI-compatible API natively).
#  - WORKER_MODELS: registers for qwen3-4b so the scheduler routes GPU-model
#    jobs here; "default" also routes because the API's DEFAULT_MODEL is
#    "default" and the worker falls back to INFERENCE_MODEL per job.
#  - INFERENCE_MODEL: fallback model sent to vLLM when the job says "default".
#    Patched here too because the ConfigMap patch only updates the ConfigMap,
#    while components/inference hardcodes the env in the Deployment.
#  - Runs on the CPU pool (review K-M2): the worker is a CPU bridge making
#    HTTP calls — co-locating it on the 4-vCPU GPU node stole vLLM's CPU and
#    showed up as CFS-throttled tail latency. The GPU request from
#    components/inference (fakegpu's mechanism) must NOT apply here; the
#    nvidia.com/gpu removal is a JSON6902 patch in the overlay kustomization
#    (strategic merge cannot delete map keys). nodeSelector is overridden
#    map-style; tolerations (no merge key) is replaced with an empty list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllmworker
  namespace: mastori
spec:
  template:
    spec:
      nodeSelector:
        mastori/pool: cpu
      tolerations: []
      containers:
        - name: vllmworker
          env:
            - name: INFERENCE_BASE_URL
              value: "http://vllm.mastori.svc.cluster.local:8000"
            - name: WORKER_MODELS
              value: "default,qwen3-4b"
            - name: INFERENCE_MODEL
              value: "qwen3-4b"
          # 256Mi OOMKilled at 20K/30K with MAX_INFLIGHT=5000: the bridge
          # buffers SSE chunks for thousands of concurrent jobs. 1Gi covers
          # the deep-queue regime (2026-11-22).
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 256Mi
