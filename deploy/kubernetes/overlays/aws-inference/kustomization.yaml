# EKS GPU inference (Milestone 2). Same inference workloads as the kind
# inference overlay, without the fakegpu component: on EKS the NVIDIA AMI
# (g6.xlarge, AL2023 NVIDIA AMI) + NVIDIA device plugin (helm, make
# aws-nvidia) advertise the real nvidia.com/gpu extended resource, and
# fakegpu would fight it.
#
# Builds FROM ../aws (review K-H1), not ../../base directly: ../aws already
# carries the EKS-only patches (GHCR image rewrite for mastori/api,
# imagePullPolicy Always for api/scheduler/mockworker), so those settings
# can no longer be silently dropped by building around the overlay.
#
# Deltas on top of ../aws:
#  - vllm server (vllm-server.yaml): the real vLLM backend (mastori/vllm
#    image + Qwen3-4B weights from mastori/weights into an emptyDir), served
#    OpenAI-compatible on vllm:8000. The vLLM + weights references keep
#    absolute ECR URLs — they are GB-scale and must stay on the NAT-free
#    VPC-endpoint path.
#  - vllmworker-patch.yaml: the bridge worker calls the vLLM Service
#    directly (no Ollama adapter in the cloud path), registers for the
#    qwen3-4b model so the scheduler routes GPU jobs to it, and runs on the
#    CPU pool (review K-M2: it only proxies HTTP — it must not compete with
#    vLLM for the GPU node's 4 vCPU).
#  - inference-config-patch.yaml: default inference model = qwen3-4b.
#  - inference-adapter and mockworker scale to 0 (cloud path is
#    vllmworker → vLLM directly; mock workers are excluded from GPU runs —
#    the component also pins WORKER_MODELS=mock as defense in depth).
#
# Nothing here bills by itself: vllm requests nvidia.com/gpu and stays
# Pending until a GPU node is scaled up (make aws-gpu-scale) and the device
# plugin DaemonSet is running.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../aws
  - vllm-server.yaml
components:
  - ../../components/inference
# Same rewrite as ../aws — repeated here because a parent's images transform
# does not reach resources added by components at this level (adapter,
# vllmworker, fakegpu images would leak as mastori/api:latest).
images:
  - name: mastori/api
    newName: ghcr.io/dbaltas/mastori
    newTag: latest
patches:
  - path: pull-policy.yaml
  - path: inference-config-patch.yaml
  - path: vllmworker-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: inference-adapter
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mockworker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vllmworker
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
