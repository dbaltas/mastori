# EKS GPU inference (Milestone 2). Same inference workloads as the kind
# inference overlay, without the fakegpu component: on EKS the NVIDIA AMI
# (g6.xlarge, AL2023 NVIDIA AMI) + NVIDIA device plugin (helm, make
# aws-nvidia) advertise the real nvidia.com/gpu extended resource, and
# fakegpu would fight it.
#
# Deltas from base + components/inference:
#  - images: the mastori/api image comes from GHCR (CI-published on every
#    main push, see overlays/aws/kustomization.yaml; the image is small so
#    NAT pulls are negligible). The vLLM server and model weights in
#    vllm-server.yaml keep their absolute ECR references — they are GB-scale
#    and must stay on the NAT-free VPC-endpoint path.
#  - imagePullPolicy: Always for the inference deployments (pull-policy.yaml).
#  - vllm server (vllm-server.yaml): the real vLLM backend (mastori/vllm
#    image + Qwen3-4B weights exported from mastori/weights into an
#    emptyDir), served OpenAI-compatible on vllm:8000.
#  - vllmworker-patch.yaml: the bridge worker calls the vLLM Service
#    directly (no Ollama adapter in the cloud path) and registers for the
#    qwen3-4b model so the scheduler routes GPU jobs to it.
#  - inference-config-patch.yaml: default inference model = qwen3-4b.
#
# Nothing here bills by itself: vllmworker/vllm request nvidia.com/gpu and
# stay Pending until a GPU node is scaled up (make aws-gpu-scale) and the
# device plugin DaemonSet is running. The Ollama adapter from
# components/inference still deploys (shared component) but is unused on
# EKS: point its OLLAMA_BASE_URL at a real Ollama instance only when needed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - vllm-server.yaml
components:
  - ../../components/inference
images:
  - name: mastori/api
    newName: ghcr.io/dbaltas/mastori
    newTag: latest
patches:
  - path: pull-policy.yaml
  - path: inference-config-patch.yaml
  - path: vllmworker-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vllmworker
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
