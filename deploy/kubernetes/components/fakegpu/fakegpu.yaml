apiVersion: v1
kind: ServiceAccount
metadata:
  name: fakegpu
  namespace: mastori
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fakegpu
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fakegpu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fakegpu
subjects:
  - kind: ServiceAccount
    name: fakegpu
    namespace: mastori
---
# Advertises fake nvidia.com/gpu extended resources on the kind GPU-pool
# nodes, which have no NVIDIA hardware. Runs from the shared mastori/api
# image; on real GPU clusters the GPU Operator/device plugin supersedes it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fakegpu
  namespace: mastori
  labels:
    app: fakegpu
spec:
  selector:
    matchLabels:
      app: fakegpu
  template:
    metadata:
      labels:
        app: fakegpu
    spec:
      serviceAccountName: fakegpu # patches node status via the API
      nodeSelector:
        mastori/pool: gpu
      tolerations:
        - key: mastori/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fakegpu
          image: mastori/api:latest
          imagePullPolicy: IfNotPresent
          command: ["/fakegpu"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FAKE_GPU_COUNT
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
