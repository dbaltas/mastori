apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllmworker
  namespace: mastori
  labels:
    app: vllmworker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllmworker
  template:
    metadata:
      labels:
        app: vllmworker
    spec:
      nodeSelector:
        mastori/pool: gpu
      tolerations:
        - key: mastori/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vllmworker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllmworker
          image: mastori/api:latest
          imagePullPolicy: IfNotPresent
          command: ["/vllmworker"]
          env:
            - name: REDIS_ADDR
              value: "redis.mastori.svc.cluster.local:6379"
            - name: REDIS_WORKER_STREAM_PREFIX
              value: "jobs:worker:"
            - name: REDIS_WORKER_REGISTRY_PREFIX
              value: "workers:"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INFERENCE_BASE_URL
              value: "http://inference-adapter.mastori.svc.cluster.local:8080"
          envFrom:
            - configMapRef:
                name: inference-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              nvidia.com/gpu: 1
            limits:
              cpu: "1"
              memory: 256Mi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
