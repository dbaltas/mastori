apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mastori
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      nodeSelector:
        mastori/pool: cpu
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Drain window in cmd/api = REQUEST_TIMEOUT (60s) + 5s buffer; the kube
      # grace must cover it or SIGKILL arrives mid-drain.
      terminationGracePeriodSeconds: 75
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      containers:
        - name: api
          image: mastori/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # No CPU limit (review K-M2): with MAX_INFLIGHT=5000 the api is in
            # the measured path — CFS throttling shows up as tail latency.
            # Memory keeps a hard limit for OOM protection.
            limits:
              # 512Mi held ~3k concurrent SSE streams/pod but MAX_INFLIGHT=5000
              # (deep-queue regime, 2026-11-22) needs headroom: ~5k streams/pod.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
