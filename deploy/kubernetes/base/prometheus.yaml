apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mastori
  labels:
    app: prometheus
spec:
  replicas: 1
  # Recreate (review low): TSDB on one node; a rolling pair would double the
  # scrape state. Data is ephemeral — run `make cluster-metrics-capture`
  # BEFORE teardown (24h retention is a safety net, not the export path).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus # kubernetes_sd needs the API token
      nodeSelector:
        mastori/pool: cpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534 # nobody: the image's default USER
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=24h
            # Size cap (review low): with no cap a long experiment can fill
            # the node disk; 2Gi holds days of 5s scrapes for these series.
            - --storage.tsdb.retention.size=2Gi
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # TSDB on an emptyDir with a sizeLimit (review low): the container
        # layer previously held it, so a pod restart lost the experiment's
        # metrics before capture. Restart still loses data — capture first.
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mastori
  labels:
    app: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: mastori
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: mastori
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mastori
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mastori
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: mastori-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [mastori]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            # vllm: real vLLM server (overlays/aws-inference) exposes native
            # Prometheus metrics on its OpenAI port (8000/http) — engine
            # counters and TTFT/TPOT histograms. Absent on kind (adapter's
            # synthesized vllm:* metrics are scraped via inference-adapter).
            regex: api|scheduler|inference-adapter|vllm
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # GPU telemetry (Milestone 2): dcgm-exporter pods (Helm chart) in the
      # nvidia namespace, created by overlays/aws-nvidia on EKS. No such pods
      # on kind; SD simply finds no targets.
      - job_name: nvidia-dcgm
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [nvidia]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9400"
            action: keep
          - target_label: job
            replacement: nvidia-dcgm
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mastori
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
