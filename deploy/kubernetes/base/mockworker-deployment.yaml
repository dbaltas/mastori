apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockworker
  namespace: mastori
  labels:
    app: mockworker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mockworker
  template:
    metadata:
      labels:
        app: mockworker
    spec:
      nodeSelector:
        mastori/pool: cpu
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mockworker
      containers:
        - name: mockworker
          image: mastori/api:latest
          imagePullPolicy: IfNotPresent
          command: ["/mockworker"]
          envFrom:
            - configMapRef:
                name: mockworker-config
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
