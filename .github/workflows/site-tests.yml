name: Site generator tests

on:
  push:
    paths:
      - "cmd/sitegen/**"
      - "internal/sitegen/**"
      - ".github/workflows/site-tests.yml"
  pull_request:
    paths:
      - "cmd/sitegen/**"
      - "internal/sitegen/**"
      - ".github/workflows/site-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./cmd/sitegen/... ./internal/sitegen/...
      - name: Unit tests
        run: go test -race ./cmd/sitegen/... ./internal/sitegen/...
