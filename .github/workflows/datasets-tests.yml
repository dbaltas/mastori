name: Datasets tests

on:
  push:
    paths:
      - "cmd/datasets/**"
      - "internal/datasets/**"
      - "benchmark/workloads/datasets.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/datasets-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./cmd/datasets/... ./internal/datasets/...
      - name: Unit tests
        run: go test -race ./cmd/datasets/... ./internal/datasets/...
