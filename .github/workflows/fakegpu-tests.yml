name: Fake GPU tests

on:
  push:
    paths:
      - "cmd/fakegpu/**"
      - "internal/fakegpu/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/fakegpu-tests.yml"
  pull_request:
    paths:
      - "cmd/fakegpu/**"
      - "internal/fakegpu/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/fakegpu-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./cmd/fakegpu/... ./internal/fakegpu/...
      - name: Unit tests
        run: go test -race ./cmd/fakegpu/... ./internal/fakegpu/...
