name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "benchmark"
      - "benchmark/**"
      - "cmd/sitegen/**"
      - "internal/sitegen/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pandoc
        run: sudo apt-get update -y && sudo apt-get install -y pandoc
      - name: Build site
        run: go run ./cmd/sitegen -benchmark benchmark -out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Scoped to the deploy job (review nit): the build job needs neither
    # pages:write nor id-token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
