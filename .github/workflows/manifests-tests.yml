# Fast manifests/infra CI: renders every kustomize overlay (fails on
# malformed manifests) and validates both Terraform roots. Part of the
# Milestone 0 "Fast CI" tier (todos.md); no cluster or cloud spend needed.
name: Manifests and Terraform

on:
  push:
    paths:
      - "deploy/kubernetes/**"
      - "infra/**"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/manifests-tests.yml"
    branches: [main]
  pull_request:
    paths:
      - "deploy/kubernetes/**"
      - "infra/**"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/manifests-tests.yml"

permissions:
  contents: read

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render every overlay
        run: make kustomize-verify

  terraform:
    runs-on: ubuntu-latest
    # Both Terraform roots (infra/aws was covered before; infra/aws-ecr —
    # the long-lived registry state — was not, review low).
    strategy:
      matrix:
        dir: [infra/aws, infra/aws-ecr]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      # 1.14.8 matches the local toolchain (was 1.9.8 — review T-L1).
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: terraform validate
