name: promcapture tests

on:
  push:
    paths:
      - "cmd/promcapture/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/promcapture-tests.yml"
  pull_request:
    paths:
      - "cmd/promcapture/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/promcapture-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./cmd/promcapture/...
      - name: Unit tests
        run: go test -race ./cmd/promcapture/...
