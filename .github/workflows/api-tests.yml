name: API and inference tests

on:
  push:
    paths:
      - "cmd/api/**"
      - "cmd/mockworker/**"
      - "cmd/adapter/**"
      - "cmd/vllmworker/**"
      - "internal/api/**"
      - "internal/queue/**"
      - "internal/metrics/**"
      - "internal/tracing/**"
      - "internal/config/**"
      - "internal/worker/**"
      - "internal/registry/**"
      - "internal/adapter/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/api-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./cmd/api/... ./cmd/mockworker/... ./cmd/adapter/... ./cmd/vllmworker/... ./internal/api/... ./internal/queue/... ./internal/metrics/... ./internal/tracing/... ./internal/config/... ./internal/worker/... ./internal/registry/... ./internal/adapter/...
      - name: Unit tests
        run: go test -race ./cmd/api/... ./cmd/mockworker/... ./cmd/adapter/... ./cmd/vllmworker/... ./internal/api/... ./internal/queue/... ./internal/metrics/... ./internal/tracing/... ./internal/config/... ./internal/worker/... ./internal/registry/... ./internal/adapter/...
