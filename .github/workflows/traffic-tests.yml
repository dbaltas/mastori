name: Traffic tests

on:
  push:
    paths:
      - "cmd/traffic/**"
      - "internal/traffic/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/traffic-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./cmd/traffic/... ./internal/traffic/...
      - name: Unit tests
        run: go test -race ./cmd/traffic/... ./internal/traffic/...
