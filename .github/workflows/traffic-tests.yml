name: Traffic tests

on:
  push:
    paths:
      - "cmd/traffic/**"
      - "internal/traffic/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "deploy/kubernetes/overlays/aws/traffic/**"
      - "deploy/kubernetes/base/traffic-config.yaml"
      - "Makefile"
      - ".github/workflows/traffic-tests.yml"
  pull_request:
    paths:
      - "cmd/traffic/**"
      - "internal/traffic/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "deploy/kubernetes/overlays/aws/traffic/**"
      - "deploy/kubernetes/base/traffic-config.yaml"
      - "Makefile"
      - ".github/workflows/traffic-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./cmd/traffic/... ./internal/traffic/...
      - name: Unit tests
        run: go test -race ./cmd/traffic/... ./internal/traffic/...
